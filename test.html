<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<style>
  body {
    margin: 0;
    height: 100vh;
    display: grid;
    place-items: center;
    background: #111;
  }

  .viewer {
    position: relative;
    width: 900px;
    max-width: 90vw;
    aspect-ratio: 16 / 9;
    overflow: hidden;
    border-radius: 16px;
    cursor: ew-resize;
  }

  .viewer img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    pointer-events: none;
    user-select: none;
  }

  .top {
    opacity: var(--mix, 0);
  }
</style>
</head>
<body>

<div class="viewer" id="viewer">
  <!-- bottom image -->
  <img id="bottom">

  <!-- top image -->
  <img id="top" class="top">
</div>

<script>
  const sources = [
    "https://picsum.photos/id/1015/1200/800",
    "https://picsum.photos/id/1025/1200/800",
    "https://picsum.photos/id/1035/1200/800",
    "https://picsum.photos/id/1045/1200/800"
  ];

  const viewer = document.getElementById("viewer");
  const bottom = document.getElementById("bottom");
  const top = document.getElementById("top");

  function update(progress) {
    const segments = sources.length - 1;

    // Convert 0→1 into segment space
    const scaled = progress * segments;

    // Current pair
    const index = Math.min(
      Math.floor(scaled),
      segments - 1
    );

    // Blend amount inside current pair
    const mix = scaled - index;

    bottom.src = sources[index];
    top.src = sources[index + 1];

    viewer.style.setProperty("--mix", mix);
  }

  viewer.addEventListener("mousemove", (e) => {
    const rect = viewer.getBoundingClientRect();

    let progress =
      (e.clientX - rect.left) / rect.width;

    progress = Math.max(0, Math.min(1, progress));

    update(progress);
  });

  update(0);
</script>

</body>
</html>
